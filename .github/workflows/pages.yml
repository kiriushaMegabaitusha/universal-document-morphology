name: pages

on:
  push:
    branches: [main]
    paths:
      - "education/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the teaching page as the site root
        run: |
          mkdir -p _site
          cp education/official-documents-explainer.html _site/index.html
          cp education/official-documents-explainer.archify.md _site/source.archify.md
          cp education/README.md _site/EDITORIAL.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
